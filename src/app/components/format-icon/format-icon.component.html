<svg class="soap-art" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" fill="none" focusable="false">
  <defs>
    <linearGradient [attr.id]="'bf-soap-' + formatId()" x1="17%" y1="8%" x2="88%" y2="94%">
      <stop offset="0%" stop-color="var(--soap-highlight)"/>
      <stop offset="44%" stop-color="var(--soap-face)"/>
      <stop offset="100%" stop-color="var(--soap-shadow)"/>
    </linearGradient>
  </defs>
  @switch (formatId()) {
    @case ('coracoezinhos') {
      <g class="soap-etched" [attr.fill]="'url(#bf-soap-' + formatId() + ')'">
        <path d="M16 46C9 37 11 25 21 23c6-2 10 2 13 6 4-6 11-8 17-4 9 6 7 17 0 25L34 66 16 46Z"/>
        <path d="M51 37c-6-7-4-17 3-20 6-2 10 1 13 5 4-5 10-6 15-2 7 6 5 15-1 21L67 54 51 37Z"/>
        <path d="M50 59c-6-8-4-18 4-21 6-2 11 1 14 5 4-5 10-5 15-1 7 7 4 16-2 22L66 79 50 59Z"/>
      </g>
      <path class="soap-gleam" d="M19 33c2-7 9-8 13-1M56 25c3-3 7-3 10 0M54 49c4-5 8-4 11-1"/>
    }
    @case ('mini-florzinhas') {
      <g transform="translate(12 10) scale(.62)">
        @for (angle of petals; track angle) {
          <ellipse class="soap-petal" cx="48" cy="26" rx="9" ry="20" [attr.transform]="'rotate(' + angle + ' 48 48)'"/>
        }
        <circle class="soap-core" cx="48" cy="48" r="12"/>
        <circle class="soap-etched" cx="48" cy="48" r="4"/>
      </g>
      <g transform="translate(49 25) scale(.52)">
        @for (angle of petals; track angle) {
          <ellipse class="soap-petal" cx="48" cy="26" rx="9" ry="20" [attr.transform]="'rotate(' + angle + ' 48 48)'"/>
        }
        <circle class="soap-core" cx="48" cy="48" r="12"/>
      </g>
      <g transform="translate(24 50) scale(.37)">
        @for (angle of petals; track angle) {
          <ellipse class="soap-petal" cx="48" cy="26" rx="9" ry="20" [attr.transform]="'rotate(' + angle + ' 48 48)'"/>
        }
        <circle class="soap-core" cx="48" cy="48" r="12"/>
      </g>
    }
    @case ('patinha-m') {
      <g class="soap-etched" [attr.fill]="'url(#bf-soap-' + formatId() + ')'">
        <path d="M36 46c-5-1-11 2-15 8-8 11-1 21 11 19 7-1 10-5 16-5 7 0 9 5 17 5 13 0 19-11 10-21-5-6-11-9-17-7-7 3-14 3-22 1Z"/>
        <ellipse cx="23" cy="38" rx="7" ry="10" transform="rotate(-17 23 38)"/>
        <ellipse cx="41" cy="29" rx="7.5" ry="11" transform="rotate(-7 41 29)"/>
        <ellipse cx="59" cy="29" rx="7.5" ry="11" transform="rotate(9 59 29)"/>
        <ellipse cx="77" cy="38" rx="7" ry="10" transform="rotate(20 77 38)"/>
      </g>
      <path class="soap-gleam" d="M28 58c4-7 10-7 14-6M38 24l2-2M57 24l2-2"/>
    }
    @case ('patinha-g') {
      <g class="soap-etched" [attr.fill]="'url(#bf-soap-' + formatId() + ')'">
        <path d="M32 46c-8 0-15 6-19 15-5 13 4 24 17 22 7-1 13-6 20-6 9 0 13 7 23 6 13-1 21-13 14-25-5-9-14-14-23-12-8 2-22 2-32 0Z"/>
        <ellipse cx="20" cy="32" rx="8.5" ry="12" transform="rotate(-22 20 32)"/>
        <ellipse cx="40" cy="23" rx="9" ry="13" transform="rotate(-6 40 23)"/>
        <ellipse cx="61" cy="23" rx="9" ry="13" transform="rotate(8 61 23)"/>
        <ellipse cx="81" cy="33" rx="8.5" ry="12" transform="rotate(23 81 33)"/>
      </g>
      <path class="soap-gleam" d="M23 63c4-9 12-11 19-9M35 16c2-3 5-4 7-4M59 13l4 3"/>
    }
    @case ('barra-arredondada') {
      <ellipse class="soap-underside" cx="49" cy="65" rx="36" ry="17"/>
      <path class="soap-rim" d="M13 46v15c0 19 72 19 72 0V46"/>
      <ellipse class="soap-etched" cx="49" cy="46" rx="36" ry="24" [attr.fill]="'url(#bf-soap-' + formatId() + ')'"/>
      <ellipse class="soap-inner" cx="49" cy="46" rx="28" ry="17"/>
      <path class="soap-gleam" d="M23 41c7-13 29-20 46-9"/>
    }
    @case ('floral') {
      <g class="soap-etched">
        <ellipse class="soap-underside" cx="48" cy="57" rx="31" ry="25"/>
        @for (angle of floralPetals; track angle) {
          <ellipse class="soap-petal" cx="48" cy="27" rx="10.2" ry="21" [attr.transform]="'rotate(' + angle + ' 48 48)'"/>
        }
        <circle class="soap-core" cx="48" cy="48" r="15"/>
        <circle class="soap-inner" cx="48" cy="48" r="10"/>
        @for (angle of petals; track angle) {
          <circle class="soap-dot" cx="48" cy="40" r="2.1" [attr.transform]="'rotate(' + angle + ' 48 48)'"/>
        }
        <circle class="soap-dot" cx="48" cy="48" r="3.5"/>
      </g>
    }
    @case ('massageador') {
      <path class="soap-rim" d="M12 53c0-18 72-18 72 0v12c0 20-72 20-72 0V53Z"/>
      <ellipse class="soap-etched" cx="48" cy="49" rx="36" ry="22" [attr.fill]="'url(#bf-soap-' + formatId() + ')'"/>
      <g class="soap-nubs">
        <ellipse cx="28" cy="42" rx="6" ry="9"/>
        <ellipse cx="42" cy="37" rx="6" ry="10"/>
        <ellipse cx="56" cy="37" rx="6" ry="10"/>
        <ellipse cx="69" cy="42" rx="6" ry="9"/>
        <ellipse cx="23" cy="55" rx="5.4" ry="8"/>
        <ellipse cx="36" cy="53" rx="6" ry="9"/>
        <ellipse cx="50" cy="52" rx="6" ry="9"/>
        <ellipse cx="64" cy="53" rx="6" ry="9"/>
        <ellipse cx="75" cy="54" rx="5.2" ry="7"/>
      </g>
      <path class="soap-gleam" d="M23 37c4-8 13-12 25-12"/>
    }
  }
</svg>
