name: Generate French Lavender images
on:
  push:
    branches:
      - feat/lavanda-francesa-medallions
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tooling
        run: python -m pip install Pillow==11.3.0
      - name: Generate assets
        run: python scripts/generate_lavanda_medallions.py
      - name: Persist generated images in the feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/format-medallions/lavanda-francesa public/data/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "feat(catalog): publish lavender medallion WebP files"
            git push
          fi
