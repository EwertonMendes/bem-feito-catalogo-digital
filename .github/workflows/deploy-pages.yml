name: Deploy catálogo digital (GitHub Pages)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Angular
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Repositório inicial sem package-lock.json.
      # Quando houver lockfile versionado, preferir npm ci.
      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Verificar tipos TypeScript
        run: npm run typecheck

      - name: Compilar Angular para o subdiretório do Pages
        run: npm run build -- --base-href=/bem-feito-catalogo-digital/

      - name: Validar arquivos públicos
        run: |
          test -f dist/bem-feito-essencia-viva/browser/index.html
          test -f dist/bem-feito-essencia-viva/browser/data/catalog.json
          test -f dist/bem-feito-essencia-viva/browser/assets/brand/bem-feito-logo.png
          grep -q 'bem-feito-catalogo-digital/' dist/bem-feito-essencia-viva/browser/index.html
          touch dist/bem-feito-essencia-viva/browser/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/bem-feito-essencia-viva/browser

  deploy:
    name: Publicar GitHub Pages
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
